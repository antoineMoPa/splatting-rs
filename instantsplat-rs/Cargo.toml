[package]
name = "instantsplat-rs"
version = "0.1.0"
edition = "2024"
description = "InstantSplat-style Gaussian splats from a few photos: MapAnything on candle for points and cameras, a wgpu rasterizer for the optimization"
license = "Apache-2.0"
readme = "README.md"

[features]
default = ["mapanything"]
# The feed-forward network stage (candle, Metal). Off for wasm32: candle has no WebGPU backend.
mapanything = ["dep:mapanything-rs", "dep:candle-core", "dep:candle-nn", "dep:hf-hub"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
candle-core = { version = "0.11", features = ["metal"], optional = true }
candle-nn = { version = "0.11", features = ["metal"], optional = true }
clap = { version = "4", features = ["derive"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mapanything-rs = { path = "../mapanything-rs", optional = true }
nalgebra = "0.34"
pollster = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "webgpu"] }

[dev-dependencies]
rand = "0.9"
